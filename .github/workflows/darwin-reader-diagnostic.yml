name: Darwin reader diagnostic
on:
  push:
    branches: [ci/darwin-reader]
permissions:
  contents: read
jobs:
  reader:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Descriptor snapshot identity and offsets
        run: bun test --timeout 30000 packages/session-host/src/__tests__/git-object-snapshot.test.ts
