# GitHub Actions Release Workflow
#
# Builds and releases deck binary for multiple platforms.
# Triggered on:
#   - Push to main (automatic build, pre-release)
#   - Version tag push v* (stable release)
#   - Push to fix/session-pending-issues (qualification only)

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/session-pending-issues
    tags:
      - "v*"

# Cancel in-progress runs when a new workflow with the same group name starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine version from tag or build type
  metadata:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      is_release: ${{ steps.tag.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # Check if this is a tag push or main push
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ${VERSION} does not match package.json version ${PACKAGE_VERSION}." >&2
              exit 1
            fi
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            # For main pushes, use package.json version with suffix
            VERSION="$PACKAGE_VERSION"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

  fresh-retirement:
    name: Fresh runner retirement contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - name: Isolated fresh install, preparation, launch and safety contracts
        run: bun run scripts/verify-retirement-fresh.ts "${{ runner.temp }}/retirement-fresh"
      - name: Retain fresh contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-fresh-contracts
          path: ${{ runner.temp }}/retirement-fresh

  release-verification:
    name: Release verification gates
    needs: [metadata, fresh-retirement]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generated asset freshness
        run: bun test scripts/generate-pi-extension-assets.test.ts scripts/generate-runner-execution-assets.test.ts

      - name: Full test suite
        run: bun test --timeout 30000

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Validate Supermemory OpenSpec change
        run: bun run apps/cli/src/main.tsx openspec validate --json --root . --change canonical-supermemory-conversation-memory

      - name: Supermemory deterministic runtime benchmark
        run: bun run bench:memory

      - name: Compiled Supermemory and Deck CLI runtime smoke
        run: bun run verify:supermemory-compiled

  # Build binaries for all platforms
  build:
    name: Build (${{ matrix.target }})
    needs: [metadata, release-verification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build canonical release artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bun run scripts/build-binaries.ts --target "$TARGET"

      - name: Verify extracted release artifact
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          ARCHIVE_PATH="dist/cli/deck_v${VERSION}_${TARGET}.tar.gz"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          tar -xzf "$ARCHIVE_PATH" -C "$VERIFY_DIR" deck
          if [[ "$TARGET" == darwin-* ]]; then
            codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/deck"
          fi
          set -o pipefail
          bun run scripts/verify-git-diff-runtime.ts --target "$TARGET" --artifact "$VERIFY_DIR/deck" 2>&1 | tee qualification.log

      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.target }}
          path: qualification.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deck-${{ matrix.target }}
          path: |
            dist/cli/deck_v${{ needs.metadata.outputs.version }}_${{ matrix.target }}.tar.gz
            dist/cli/checksums.txt

  # Create GitHub Release
  release:
    name: Create release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && needs.metadata.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Move only the tar.gz archives, skip checksums.txt (we concatenate them below)
          mv artifacts/deck-*/deck_v*.tar.gz release-assets/
          ls -la release-assets/

      - name: Create checksums combined
        run: |
          cat artifacts/deck-*/checksums.txt > release-assets/checksums.txt

      - name: Generate release descriptor
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          bun run scripts/generate-build-info.ts \
            --version "${VERSION#v}" \
            --commit "$GITHUB_SHA" \
            --target linux-x64 \
            --channel stable
          ASSET_BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"
          bun run scripts/prepare-release.ts \
            --non-interactive \
            --version "${VERSION#v}" \
            --tag "v${VERSION}" \
            --channel stable \
            --from-assets-dir release-assets \
            --asset-base-url "${ASSET_BASE_URL}" \
            --out release-assets/release.json
          cat release-assets/release.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: Deck v${{ needs.metadata.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.metadata.outputs.version, '-beta') || contains(needs.metadata.outputs.version, '-alpha') }}
          generate_release_notes: true
          files: |
            release-assets/deck_v*_linux-x64.tar.gz
            release-assets/deck_v*_linux-arm64.tar.gz
            release-assets/deck_v*_darwin-x64.tar.gz
            release-assets/deck_v*_darwin-arm64.tar.gz
            release-assets/checksums.txt
            release-assets/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload pre-release artifacts (main pushes only)
  artifacts:
    name: Upload pre-release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.metadata.outputs.is_release == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare artifacts
        run: |
          mkdir -p release-assets
          # Move only the tar.gz archives, skip checksums.txt (we concatenate them below)
          mv artifacts/deck-*/deck_v*.tar.gz release-assets/
          ls -la release-assets/

      - name: Create checksums combined
        run: |
          cat artifacts/deck-*/checksums.txt > release-assets/checksums.txt

      - name: Generate release descriptor
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          bun run scripts/generate-build-info.ts \
            --version "${VERSION}" \
            --commit "$GITHUB_SHA" \
            --target linux-x64 \
            --channel dev
          ASSET_BASE_URL="https://github.com/${REPO}/releases/download/build-${VERSION}"
          bun run scripts/prepare-release.ts \
            --non-interactive \
            --version "${VERSION}" \
            --tag "build-${VERSION}" \
            --channel dev \
            --from-assets-dir release-assets \
            --asset-base-url "${ASSET_BASE_URL}" \
            --out release-assets/release.json
          cat release-assets/release.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ needs.metadata.outputs.version }}"
          name: "Deck v${{ needs.metadata.outputs.version }} (pre-release)"
          draft: true
          prerelease: true
          generate_release_notes: false
          files: |
            release-assets/deck_v*_linux-x64.tar.gz
            release-assets/deck_v*_linux-arm64.tar.gz
            release-assets/deck_v*_darwin-x64.tar.gz
            release-assets/deck_v*_darwin-arm64.tar.gz
            release-assets/checksums.txt
            release-assets/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
