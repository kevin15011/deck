# Published migration evidence: manual diagnostics and stable release qualification.
name: Historical retirement diagnostic
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAVILY_API_KEY:
        required: false
jobs:
  published-migration:
    name: Published migration (${{ matrix.runner }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [codex, claude, opencode, pi]
    steps:
      - name: Checkout pinned source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Migration harness authority, recovery and publication contracts
        run: bun test scripts/retirement-publication-contract.test.ts scripts/retirement-manual-fixture.test.ts
      - name: Published installation and migration matrix
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: bun run scripts/verify-retirement-published-matrix.ts --install-dependencies --live-search --allow-incomplete --runner=${{ matrix.runner }} --output="${{ runner.temp }}/retirement-matrix/base"
      - name: Selected historical Serena and Codebase Memory variants
        if: ${{ !cancelled() }}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: bun run scripts/verify-retirement-published-matrix.ts --install-dependencies --live-search --allow-incomplete --runner=${{ matrix.runner }} --selected-variants --output="${{ runner.temp }}/retirement-matrix/selected"
      - name: Require complete published base and selected evidence
        if: ${{ !cancelled() }}
        run: bun run scripts/verify-retirement-publication-evidence.ts --runner=${{ matrix.runner }} --base="${{ runner.temp }}/retirement-matrix/base/matrix.json" --selected="${{ runner.temp }}/retirement-matrix/selected/matrix.json"
      - name: Retain published migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-published-matrix-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/retirement-matrix/*/*.json
            ${{ runner.temp }}/retirement-matrix/*/*.log
            ${{ runner.temp }}/retirement-matrix/*/homes/*/historical-installation.json
            ${{ runner.temp }}/retirement-matrix/*/homes/*/historical-verification.json
            ${{ runner.temp }}/retirement-matrix/*/homes/*/historical-selected-effects.json
            ${{ runner.temp }}/retirement-matrix/*/homes/*/candidate-migration.json
            ${{ runner.temp }}/retirement-matrix/*/homes/*/candidate-adapter-backup-*.json.gz
            ${{ runner.temp }}/retirement-matrix/*/homes/*/candidate-checkpoint.json
            ${{ runner.temp }}/retirement-matrix/*/homes/*/manual-external-tool-fixture.json
            ${{ runner.temp }}/retirement-matrix/*/homes/*/fixture-prerequisites/serena/requirements.in
            ${{ runner.temp }}/retirement-matrix/*/homes/*/fixture-prerequisites/serena/requirements.txt
