[workspace]
members = ["crates/shared", "crates/host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
deck2-shared = { path = "crates/shared" }

[profile.release]
lto = "thin"
strip = true
