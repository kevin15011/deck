[workspace]
members = ["crates/shared", "crates/host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
deck2-shared = { path = "crates/shared" }

[profile.release]
lto = "thin"
strip = true

# Fast test suite: dependencies (SQLite C, sha2, p256, image, flate2...) are
# compiled once with optimizations and stay cached in target/debug; deck2
# itself stays unoptimized for fast incremental rebuilds. Line tables keep
# panic backtraces with file:line while shrinking link time and disk use.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
