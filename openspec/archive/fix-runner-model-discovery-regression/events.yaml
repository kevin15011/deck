events:
  - phase: explorer
    status: completed
    timestamp: "2026-07-12T00:00:00Z"
    artifact: openspec/changes/fix-runner-model-discovery-regression/exploration.md
    event: exploration-completed
    summary: |
      Diagnostic exploration completed. Root cause identified as a release artifact
      mismatch, not a code regression. The source code at HEAD (commit 1be5bf9,
      2026-06-24) contains all necessary fixes for runner-owned model inventory
      discovery with configured-provider filtering:

      (1) model-inventory.ts implements resolveConfiguredProviderIds() which reads
      ~/.local/share/opencode/auth.json and environment variables to determine which
      providers the user has actually configured. parseFlatProviderMapFromCache()
      filters the OpenCode cache to only include configured providers.

      (2) runner-adapter.ts getModelInventory() calls loadModelInventory() and caches
      the result. getThinkingLevels(modelId) looks up model-specific effort variants
      from reasoning_options[].values in the inventory. supportsThinking(modelId)
      checks inventory variants first, falls back to catalog for non-cache models.

      (3) app.tsx detectOpenCodeModelInventoryForTui() prefers adapter.getModelInventory()
      over the opencode models CLI subset. buildTuiInventoryFromAdapterInventory()
      maps the adapter inventory to TUI shape. getActiveThinkingLevels(modelId) calls
      adapter.getThinkingLevels(targetModelId) for OpenCode.

      (4) developer-team-screens.tsx AgentModelAssignmentScreen accepts an optional
      thinkingLevels? prop sourced from adapter.getThinkingLevels(selectedModel.id).

      However, the installed binary at /home/kevinlb/.local/bin/deck is dated
      2026-06-17, while the fix commit 7d47a4c was committed on 2026-06-21 — 4 days
      later. The stale binary does NOT include any of these fixes. A newer build at
      dist/cli/deck (2026-06-26) includes all fixes but was never installed to PATH.

      Test coverage is comprehensive: model-inventory.test.ts has 25+ test cases
      covering configured-provider filtering, auth.json reading, env-var detection,
      effort variant extraction, and edge cases.

      Recommended action: rebuild and reinstall the binary from current source
      (bun run build && cp dist/cli/deck ~/.local/bin/deck). Secondarily, formalize
      OpenSpec tracking by completing opencode-configured-providers-filter and
      archiving fix-opencode-effort-levels-hardcoded. No new architecture change is
      needed.
    findings:
      - "Installed binary /home/kevinlb/.local/bin/deck dated 2026-06-17 predates fix commit 7d47a4c (2026-06-21) by 4 days"
      - "Source code at HEAD has all fixes: resolveConfiguredProviderIds, model-specific getThinkingLevels, TUI adapter inventory preference"
      - "Newer build at dist/cli/deck (2026-06-26) includes all fixes but was never installed to PATH"
      - "Package version 0.2.1 is the same in both stale and fixed builds — no version bump to distinguish"
      - "opencode-configured-providers-filter change is in_progress with backend task listed as remaining, but code is implemented"
      - "fix-opencode-effort-levels-hardcoded change is apply completed but not verified/archived"
      - "model-inventory.test.ts has 25+ test cases covering configured-provider filtering and effort variant extraction"
      - "Static PROVIDERS list (10 entries) in model-catalog.ts remains as fallback enrichment but is not the primary inventory source"
    recommendation: |
      Rebuild and reinstall the binary from current source. Complete and archive the
      opencode-configured-providers-filter and fix-opencode-effort-levels-hardcoded
      changes. Consider a version bump to distribute the fix to other installed copies.
      No new proposal/spec/design is needed — this is a release process fix, not an
      architecture change.

  - phase: explorer
    status: completed
    timestamp: "2026-07-12T19:20:00Z"
    artifact: openspec/changes/fix-runner-model-discovery-regression/exploration.md
    event: exploration-corrected
    supersedes: exploration-completed
    summary: |
      User runtime correction invalidated the stale-installed-binary diagnosis.
      Direct inspection confirmed npm run deck:run rebuilds and executes the
      current dist binary. Deck's actual defect is a source-of-truth mismatch:
      it derives inventory and effort levels from the configured-provider-filtered
      OpenCode cache instead of the runner's resolved model inventory.
    findings:
      - "Deck cache candidates: 148; opencode models result: 107"
      - "58 cache-derived candidates are not reported by the runner"
      - "17 runner-reported models are absent from Deck's filtered set"
      - "opencode models --verbose exposes final per-model variants"
      - "33 of 99 comparable models have live/cache variant mismatches"
      - "16 models have live variants where Deck cache extraction yields none"
      - "The built-in opencode provider is runner-available but omitted by auth-based filtering"
    recommendation: |
      Make the runner's resolved verbose model inventory authoritative for both
      model visibility and selectable variant names. Keep the cache as metadata
      enrichment only and fail safely without broad static-catalog fallback.

  - phase: proposal
    status: completed
    timestamp: "2026-07-12T19:21:47Z"
    artifact: openspec/changes/fix-runner-model-discovery-regression/proposal.md
    event: proposal-completed
    summary: |
      Proposal completed for runner-resolved OpenCode provider/model inventory
      and per-model reasoning variant discovery. The proposal uses the corrected
      exploration as authoritative, requires opencode models --verbose or an
      equivalent stable structured runner API, keeps cache/catalog data as
      metadata-only enrichment, defines bounded timeout/cache/invalidation and
      safe failure behavior, and preserves Pi through runner-specific contracts.
    decisions:
      - "OpenCode provider/model availability comes from the runner's final resolved model set, not auth-filtered models.json cache entries."
      - "Per-model reasoning levels come exactly from final runner variants keys, not cached reasoning_options, static catalogs, or canonical hardcoded arrays."
      - "Providers are derived from runner-returned model IDs, including built-in/custom/plugin providers."
      - "Normal TUI open must not automatically run --refresh; runner-state discovery and network refresh are separate."
      - "Persisted unavailable models/variants are read compatibly and validated on new or changed writes without silent nearest-value normalization."
    reconciles:
      - opencode-configured-providers-filter
      - fix-opencode-effort-levels-hardcoded
      - tui-model-assignment-bug

