findings:
  actionable_diagnosis: true
  root_cause: |
    Deck treats the configured-provider-filtered OpenCode models.json cache as
    authoritative for model availability and reasoning levels. The live runner
    output differs: 148 cache-derived candidates versus 107 models reported by
    opencode models, with 58 cache-only entries and 17 live models absent from
    Deck's filtered set. Live verbose variants differ from cached effort values
    for 33 of 99 comparable models.
  evidence:
    runtime_command: "npm run deck:run"
    opencode_version: "1.17.18"
    deck_cache_candidate_models: 148
    runner_reported_models: 107
    cache_only_candidates: 58
    runner_only_from_deck_perspective: 17
    live_models_with_variants: 53
    comparable_variant_models: 99
    variant_mismatches: 33
    runner_variants_cache_empty: 16
    nonempty_variant_disagreements: 17
  recommended_option: |
    Use opencode models --verbose or an equivalent stable runner API as the
    authoritative resolved inventory and variant source. Treat models.json only
    as optional metadata enrichment and never as permission to add models or
    variants absent from the runner result.
proposal:
  status: completed
  artifact: openspec/archive/fix-runner-model-discovery-regression/proposal.md
  preconditions_artifact: openspec/archive/fix-runner-model-discovery-regression/preconditions.md
  event: proposal-completed
  timestamp: "2026-07-12T19:21:47Z"
  scope_summary: |
    OpenCode provider/model inventory and per-model reasoning levels must come
    from the runner's final resolved model set. Cache/catalog data is metadata
    enrichment only, with bounded discovery caching/failure behavior and
    compatibility handling for stale persisted assignments.
  decisions:
    - "Use opencode models --verbose or an equivalent stable structured runner API as the authoritative OpenCode inventory source."
    - "Derive providers from runner-returned model IDs, including built-in/custom/plugin providers."
    - "Expose exactly each model's final runner variants keys as reasoning levels."
    - "Do not run --refresh automatically on normal TUI open."
    - "Keep Pi and other adapters on runner-specific contracts with anti-regression coverage."
