  user_request: |
    Deck must show only providers and models recognized by the active runner and
    must derive each model's available reasoning levels from the runner rather
    than from hardcoded or stale cache metadata.
  user_runtime_correction: |
    The user runs npm run deck:run, which rebuilds and executes ./dist/cli/deck.
