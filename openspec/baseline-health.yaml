verify_policy:
  focused_commands_must_pass: true
  new_failures_block: true
  known_failures_require_reference: true
  pass_with_warnings_requires_ledger_entry: true

comparison:
  fingerprint_fields:
    - suite
    - test_name
    - file_path
    - error_signature
  classification:
    known: "Current failure matches the recorded exact fingerprint."
    regression: "Current failure does not match a recorded fingerprint."
    improved: "A recorded failure no longer appears in current execution."

policy:
  known_failures: "Only the recorded Binary smoke doctor timeout is known."
  regression_definitions: |
    - Any additional test failure is a regression.
    - A changed doctor file, suite, test name, or timeout signature is a regression.
    - Any typecheck error is a regression.
  action: "Verify may pass with warnings only when the exact known fingerprint is reproduced and documented."
