      fingerprints:
        - file_path: apps/cli/src/__tests__/binary-smoke.test.tsx
          suite: "Binary smoke tests"
          test_name: "doctor runs and reports diagnostics"
          error_signature: "bun-test-timeout-5000ms; killed 1 dangling process"
          classification: known
          reproduction: "Bun test-level timeout after 5000 ms"
