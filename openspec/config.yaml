schema: spec-driven
initialized: true
last_index: "2026-05-25T11:23:00Z"
index_mode: full

context: |
  Tech stack: TypeScript, Bun (runtime + package manager), React, Ink (CLI TUI)
  Architecture: Monorepo (apps/cli, packages/core, packages/adapter-*)
  Testing: Bun built-in test runner, fast suite with 2s per file and 90s total wall-time budgets
  Style: ES2022, ESNext modules, strict TypeScript, no explicit linter/formatter

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect existing active change boundaries
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Verify proportionally; focused checks in the edit loop, bun run test and bunx tsc --noEmit before commit; Lead runs a short live canary for runner or installation changes
  verify:
    - Reuse Apply evidence bound to the same candidate; run only missing or invalidated checks
  archive:
    - Warn before merging destructive deltas

testing:
  policy: proportional
  red_first:
    - reproducible_bug_fix
    - specified_logic
  commands:
    focused: "bun test <file>"
    affected: "bun run test"
    typecheck: "bunx tsc --noEmit"
    full: "bun run test"
  budgets:
    file_seconds: 2
    run_seconds: 90
  quarantine: tests/quarantine.yaml
  baseline_health:
    ledger: openspec/baseline-health.yaml
    policy: |
      - Focused commands must pass for change closure
      - New failures in repo-wide commands block closure
      - Known failures require explicit ledger reference
      - Pass with warnings requires documented known failures
  security_constraints: |
    - No real installations performed
    - No network calls in test gates
    - No user filesystem writes
    - Deterministic mocks for all external dependencies
  quality:
    type_checker:
      command: "bunx tsc --noEmit"
